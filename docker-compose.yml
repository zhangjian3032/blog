services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: photoblog
      POSTGRES_USER: photoblog
      POSTGRES_PASSWORD: photoblog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-01-20T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T00-00-00Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "
      mc alias set local http://minio:9000 minio minio123 &&
      (mc mb -p local/photoblog || true) &&
      mc anonymous set download local/photoblog || true
      "

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
      - minio
      - minio-init
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://photoblog:photoblog@postgres:5432/photoblog
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: change-me
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: photoblog
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: http://localhost:9000

volumes:
  pgdata:
  miniodata:

